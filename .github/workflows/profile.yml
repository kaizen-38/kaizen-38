name: Update profile stats

on:
  schedule:
    - cron: "17 4 * * *"     # daily, 04:17 UTC
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["scripts/**", "README.md", ".github/workflows/profile.yml"]

permissions:
  contents: write

jobs:
  loc:
    name: Lines of code and frameworks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Count authored lines across all repositories
        env:
          # Needs `repo` scope to see private repos. A default GITHUB_TOKEN only
          # sees this repository, so set PROFILE_TOKEN to a PAT to include them.
          GH_TOKEN: ${{ secrets.PROFILE_TOKEN || github.token }}
          GH_USER: kaizen-38
          GH_AUTHORS: kaizen-38|rarya124@asu.edu
          OUT: loc_stats.json
        run: python scripts/loc_stats.py --with-frameworks

      # Without PROFILE_TOKEN the run only sees public repos and would silently
      # replace the full figure with a smaller one. Refuse to regress.
      - name: Guard against a partial count
        id: guard
        run: |
          new=$(jq -r '.repo_count // (.per_repo|length)' loc_stats.json)
          old=$(git show HEAD:loc_stats.json 2>/dev/null | jq -r '.repo_count // (.per_repo|length)' || echo 0)
          echo "scanned $new repositories, previous run saw $old"
          if [ "$new" -lt "$old" ]; then
            echo "::warning::Only $new of $old repositories visible - set PROFILE_TOKEN to include private repos. Skipping commit."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Render README
        if: steps.guard.outputs.ok == 'true'
        env:
          GH_TOKEN: ${{ secrets.PROFILE_TOKEN || github.token }}
          GH_USER: kaizen-38
          STATS: loc_stats.json
        run: python scripts/render_readme.py

      - name: Commit if changed
        if: steps.guard.outputs.ok == 'true'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md loc_stats.json
          git diff --staged --quiet || git commit -m "chore: refresh language and framework stats"
          git push

  waka:
    name: WakaTime coding time
    runs-on: ubuntu-latest
    needs: loc
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      # The secrets context is not usable in a job-level `if`, so gate on a step
      # output instead. Without the key this job is a clean no-op, not a failure.
      - id: gate
        env:
          KEY: ${{ secrets.WAKATIME_API_KEY }}
        run: |
          if [ -n "$KEY" ]; then echo "have=true" >> "$GITHUB_OUTPUT"
          else echo "have=false" >> "$GITHUB_OUTPUT"; echo "::notice::WAKATIME_API_KEY not set - skipping"; fi

      - uses: athul/waka-readme@master
        if: steps.gate.outputs.have == 'true'
        with:
          WAKATIME_API_KEY: ${{ secrets.WAKATIME_API_KEY }}
          GH_TOKEN: ${{ secrets.PROFILE_TOKEN || github.token }}
          SHOW_TITLE: "true"
          TIME_RANGE: all_time
          LANG_COUNT: 12
          BLOCKS: ">-"
